[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gridconf"
version = "0.1.0"
description = "Lightweight config loader with imports, string interpolation, and grid-search axis expansion"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.urls]
Repository = "https://github.com/rfechner/configmanager"

[tool.setuptools.packages.find]
where = ["."]
include = ["gridconf*"]
